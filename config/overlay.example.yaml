# Host overlay: the template for /etc/capitoline/overlay.yaml (docs/deploy.md §7).
#
# The service loads config/capitoline.yaml from the clone as the base and
# merges this file over it, so everything that is not host-specific — flags,
# model aliases, effort mapping, timeouts, budgets — arrives with the `git
# pull` that changes it and is not repeated here. What stays is the dozen
# lines the host genuinely says differently: where the binaries are, who runs
# them, where the sandboxes and the database live, and the Access application.
#
# Merge rules (src/config.ts, mergeConfig): objects merge key by key; a scalar
# or a list replaces the base's value whole, never appending to it; `null` is a
# value, not a deletion. The merged result is validated once by the same strict
# schema, so a mistyped key here is rejected by name.
#
# Secrets are not in this file and never should be: the Claude OAuth token
# lives in /home/runner/.claude/capitoline.json, owned by runner and 0600, and
# the gateway process never reads it.

runner:
  user: runner                                # the CLIs run as this user, through sudo (§5)
  sandbox_root: /var/lib/capitoline/sandboxes

usage:
  db_path: /var/lib/capitoline/usage.sqlite    # absolute: the service's working directory is the clone

server:
  access:
    # What to call each service token in /v1/usage, by its client id.
    # Cloudflare's service-token JWT carries the client id and not the name
    # typed in the dashboard, so without this the breakdown groups the
    # applications correctly and names none of them.
    callers:
      "0000000000000000000000000000000a.access": app-one
      "0000000000000000000000000000000b.access": app-two
    # Filled in §9, from the Zero Trust dashboard. Both empty disables the JWT
    # verification, which is the only state in which this gateway may be
    # reachable from 127.0.0.1 alone.
    team_domain: ""      # <your-team>.cloudflareaccess.com
    audience: ""         # the Access application's AUD tag

providers:
  claude:
    binary: /home/runner/.npm-global/bin/claude
    # Only what this host adds. `args_extra` is appended to the repository's
    # `args`, so a pull that changes the command line upstream reaches this
    # host — which copying the whole list into `args` did not, since a list
    # replaces and is never appended to.
    #
    # --settings points at the file holding the OAuth token, readable by
    # runner only, and applies even with --setting-sources "". Needed only on
    # a host authenticated with a setup token; a host where `claude /login`
    # was run interactively leaves this out entirely.
    args_extra:
      - --settings
      - /home/runner/.claude/capitoline.json

  codex:
    binary: /home/runner/.npm-global/bin/codex

  antigravity:
    binary: /home/runner/.local/bin/agy
    # No image.collect override: the repository already names
    # /usr/local/bin/capitoline-collect-image, which is the path the sudoers
    # rule of §5 names, so repeating it here only invites the two to drift.
    # Set it only on a host that installs the helper somewhere else.
