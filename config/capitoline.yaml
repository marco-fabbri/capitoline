# Capitoline configuration. Everything that depends on a CLI's flags, model
# aliases or output format lives here, not in code. Verified against the CLI
# versions of docs/update-clis.md, "Versions in use"; a host changes only what
# its overlay says (docs/deploy.md §7).

server:
  port: 8080
  access:
    # Cloudflare Access application. Empty = JWT verification disabled (local dev only).
    team_domain: ""
    audience: ""
  queue:
    max_wait_s: 120
  # What the host uses with no CLI running: the gateway (~90 MB), cloudflared
  # (~30 MB) and the runner's resident services. Measured 2026-09-23 on the
  # owner's host; the startup check adds it to the CLIs' share (design §4.1).
  memory_mb: 150

runner:
  user: runner            # Linux user that owns the CLI credentials
  sandbox_root: /var/lib/capitoline/sandboxes
  kill_grace_s: 5         # SIGTERM → SIGKILL delay

usage:
  db_path: capitoline.sqlite   # relative to the working directory of the service

providers:
  claude:
    binary: claude
    # How many runs at once, sized from memory and not from the subscription:
    # parallel runs spend the same quota as the same runs one after another,
    # only sooner. Ten per CLI is the default; what it costs is design §4.1.
    concurrency: 10
    memory_mb: 250            # peak of one run, 214 MB under council load (2026-09-27, Claude Code 2.1.280)
    timeout_s: 600
    budget: { window_5h_tokens: 0, window_7d_tokens: 0 }   # 0 = not declared; real windows come from rate_limit_event
    health_model: claude-haiku
    # The daily "a new version exists" notice (docs/update-clis.md); installing
    # is scripts/update-cli.sh, run by a person.
    version: { args: [--version], verified: 2.1.285, latest: { npm: "@anthropic-ai/claude-code" } }
    models:
      claude-opus:   { cli_model: opus }
      claude-sonnet: { cli_model: sonnet }
      claude-haiku:  { cli_model: haiku }
      claude-fable:  { cli_model: fable }
      # The long-context variants the CLI lists beside the plain aliases. Same
      # models, a different context window, and the brackets are part of the
      # alias: nothing here goes through a shell, so they reach --model as
      # written.
      claude-sonnet-1m: { cli_model: "sonnet[1m]" }
      claude-opus-1m:   { cli_model: "opus[1m]" }
      claude-fable-1m:  { cli_model: "fable[1m]" }
      # Deliberately absent, and they are in the CLI's list: `best`, `default`
      # and `opusplan` are routing aliases that resolve to a model this table
      # already names. Exposing them would add a name and no reach, and every
      # one of them would be a second gateway name for an id another entry
      # holds — which is a pause the gateway has to reconcile for nothing.
    effort: { low: low, medium: medium, high: high, xhigh: xhigh, max: max }   # --effort value (claude --help: low, medium, high, xhigh, max)
    model_flag: --model         # <flag> <cli_model>
    effort_flag: --effort       # <flag> <effort value>
    effort_key: null            # the value is passed bare, not as key="value"
    args:
      - -p
      - --output-format
      - stream-json
      - --verbose
      - --include-partial-messages
      - --tools
      - ""
      - --strict-mcp-config
      - --disable-slash-commands
      - --setting-sources
      - ""
      - --no-session-persistence
      - --permission-prompts
      - none
    args_extra: []            # what this host adds; only an overlay ever sets it
    system_preamble: null     # this CLI's tools are switched off by flag, so there is nothing to tell it
    system_prompt_flag: --system-prompt
    system_prompt_flag_prefix: null                  # none: the flag carries the text, not a key="value" override
    prompt_via: stdin
    # A host authenticated with a setup token adds, through its overlay's args_extra (docs/deploy.md §6.1),
    # --settings /home/runner/.claude/capitoline.json: that file (owned by runner, mode 0600) holds
    # {"env":{"CLAUDE_CODE_OAUTH_TOKEN":"..."}}, and --settings applies even with --setting-sources "",
    # so the gateway process never sees the token.

  codex:
    binary: codex
    concurrency: 10           # sized from memory, as for claude above
    memory_mb: 150            # peak of one run, 147 MB generating an image, 118 under council load (2026-09-27, Codex CLI 0.156.0)
    timeout_s: 600
    budget: { window_5h_tokens: 0, window_7d_tokens: 0 }
    health_model: codex-gpt-6-luna
    version: { args: [--version], verified: 0.159.2, latest: { npm: "@openai/codex" } }
    # Probed instead when the catalog says health_model is no longer listed.
    health_fallback: [codex-gpt-5.6-luna]
    # The daily catalog (docs/deploy.md §7.2): `codex debug models` is the
    # CLI's own list. A listed model no entry below reaches is served as
    # codex-<slug>; an entry whose slug is no longer listed is retired.
    discover: { args: [debug, models], prefix: codex-, exclude: [gpt-5.5] }
    models:
      # Every slug `codex debug models` lists (test/fixtures/codex/debug-models.json).
      # `efforts` is pinned wherever the cache says the model serves fewer
      # levels than the provider's table prices, so a request asking for one it
      # does not have resolves to the nearest it does instead of being sent a
      # level the CLI would refuse.
      codex-gpt-6.1-sol:   { cli_model: gpt-6.1-sol }
      codex-gpt-6-astra:   { cli_model: gpt-6-astra }
      codex-gpt-6-sol:     { cli_model: gpt-6-sol }
      codex-gpt-6-luna:    { cli_model: gpt-6-luna,    efforts: [low, medium, high, xhigh, max] }
      codex-gpt-5.6-sol:   { cli_model: gpt-5.6-sol }
      codex-gpt-5.6-terra: { cli_model: gpt-5.6-terra }
      codex-gpt-5.6-luna:  { cli_model: gpt-5.6-luna,  efforts: [low, medium, high, xhigh, max] }
      # gpt-5.5 is still listed and deliberately absent (`discover.exclude`
      # above keeps discovery from adding it back): it retires from Codex with
      # ChatGPT sign-in on 2026-10-14 (developers.openai.com/codex/models).
      # The two the cache lists that are not general chat models, exposed
      # because they are models the subscription serves and named so nobody
      # reaches for them by accident: `gpt-reserve` is the fallback tier, and
      # `codex-auto-review` is the model behind the CLI's own review feature.
      codex-gpt-reserve:   { cli_model: gpt-reserve,   efforts: [low, medium, high, xhigh, max] }
      codex-auto-review:   { cli_model: codex-auto-review, efforts: [low, medium, high, xhigh, max] }
      # kind: image -> served by /v1/images/generations and the generate_image
      # MCP tool. The cli_model is the agent, not the image model: the agent
      # calls Codex's built-in image generation, which runs on the ChatGPT
      # subscription with no API key and whose own model the image declares in
      # its signed C2PA manifest ("ChatGPT", "gpt-image"). The agent only has
      # to decide to call one tool, so it runs at the lowest effort.
      codex-image:         { cli_model: gpt-6-luna, kind: image, efforts: [low], timeout_s: 300 }
    effort: { low: low, medium: medium, high: high, xhigh: xhigh, max: max, ultra: ultra }   # -c model_reasoning_effort="<v>"
    model_flag: -m
    effort_flag: -c
    effort_key: model_reasoning_effort   # -c model_reasoning_effort="<v>"
    args:
      - exec
      - --json
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - -s
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - web_search="disabled"
      # Every other tool the CLI switches on by default, off. Measured on
      # 0.156.0 (2026-09-23): with only the shell and web search disabled a
      # session still offered thirteen tools — image generation (which ran,
      # from a text request, and wrote a PNG into the runner's home), plugin
      # installation, sub-agents, view_image, goals, MCP resource reads, tool
      # search — and carried the skills, sub-agent and plugin instructions in
      # every prompt. Off, a one-line question costs about 3,000 input tokens
      # fewer (9,166 against 6,180), which is quota on every call.
      #
      # Two tools survive because no setting removes them. apply_patch comes
      # from the model catalogue, not the configuration; the read-only sandbox
      # rejects it, checked with a marker file that does not exist afterwards.
      # request_user_input has no user to ask in a non-interactive run.
      #
      # A CLI update can switch new tools on without a word, and the smoke test
      # would not notice: docs/update-clis.md has the check to run.
      - -c
      - features.image_generation=false
      - -c
      - features.view_image=false
      - -c
      - features.goals=false
      - -c
      - features.plugins=false
      - -c
      - features.remote_plugin=false
      - -c
      - features.apps=false
      - -c
      - features.tool_suggest=false
      - -c
      - features.skill_search=false
      - -c
      - features.skill_mcp_dependency_install=false
      - -c
      - features.multi_agent=false
      - -c
      - features.browser_use=false
      - -c
      - features.browser_use_external=false
      - -c
      - features.browser_use_full_cdp_access=false
      - -c
      - features.in_app_browser=false
      - -c
      - features.computer_use=false
      - -c
      - features.sleep_tool=false
      - -c
      - features.tool_call_mcp_elicitation=false
      - -c
      - features.collaboration_modes=false
      # Enabled by default from Codex 0.159.0 and neither a tool of `codex exec`
      # (the daemon is for interactive launches; the approval is for escalated
      # terminals, and the shell is off), switched off anyway so a new default
      # is never left on unread (scripts/update-cli.sh stopped on them).
      - -c
      - features.daemon_auto_start=false
      - -c
      - features.write_stdin_approval=false
    args_extra: []            # what this host adds; only an overlay ever sets it
    system_preamble: null     # this CLI's tools are switched off by flag, so there is nothing to tell it
    system_prompt_flag: developer_instructions       # passed as -c developer_instructions="<text>"
    system_prompt_flag_prefix: -c                    # the flag that carries key="value" configuration overrides
    prompt_via: stdin                                # codex exec -
    image:
      # The one feature the text-run lockdown above switches off, back on for
      # image runs only. Later overrides of one key win, so this undoes
      # features.image_generation=false and nothing else.
      args: [-c, features.image_generation=true]
      # Codex reports no tool step for its image generation — the stream holds
      # the thread id, the answer "done" and the usage — so there is nothing to
      # allow: any tool step an image run reports is one the prompt forbade,
      # and the run is aborted on it.
      allowed_tools: []
      # The image lands in ~/.codex/generated_images/<thread_id>/, outside the
      # sandbox; the helper takes `codex` and the thread id (docs/deploy.md §7.1).
      collect: [/usr/local/bin/capitoline-collect-image, codex]
      min_bytes: 200000       # a real generation is over a megabyte; this rejects a placeholder
      # No quota_per_window: OpenAI publishes no image limit for Codex, and it
      # depends on the plan. It is learned from the first refusal, as the
      # Antigravity one was.

  antigravity:
    binary: agy
    # Sized from memory, as for claude above. A council also needs one slot per
    # seat it gives this provider — the reference panel seats Google and open
    # weights here, two at once — and the configuration refuses to load with
    # fewer (design §12.1).
    concurrency: 10
    memory_mb: 300            # peak of one run, 256 MB under council load (2026-09-27, Antigravity CLI 1.2.9)
    timeout_s: 600
    budget: { window_5h_tokens: 0, window_7d_tokens: 0 }
    health_model: antigravity-gemini-flash
    # The manifest the official installer reads, for this host's platform
    # (linux_amd64; linux_arm64 on an ARM host, set in the overlay).
    version: { args: [--version], verified: 1.2.14, latest: { manifest: "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json" } }
    health_fallback: [antigravity-gemini-3.7-flash]
    # `agy models` lists every id the CLI serves, the level inside the id: one
    # no entry below reaches is served as antigravity-<id> (docs/deploy.md §7.2).
    discover: { args: [models], prefix: antigravity- }
    models:
      # effort is part of the model id: <base>-<effort>
      antigravity-gemini-flash:     { cli_model: gemini-3.8-flash, effort_suffix: true }
      antigravity-gemini-3.7-flash: { cli_model: gemini-3.7-flash, effort_suffix: true }
      antigravity-gemini-3.6-flash: { cli_model: gemini-3.6-flash, effort_suffix: true }
      antigravity-gemini-pro:       { cli_model: gemini-3.1-pro,   effort_suffix: true, efforts: [low, high] }
      # Three models with the reasoning level fixed in the id rather than
      # chosen per request (effort_suffix: false): `antigravity-gemini-pro`
      # above answers at whatever effort the request asks for, while
      # `antigravity-gemini-pro-high` is always the same model at the same
      # level. That is what a rung of a capability ladder needs
      # (docs/measure-a-model.md), and what a caller pins when it wants one
      # level and no resolution. Every id is one `agy models` lists.
      #
      # These three are aliases: every one of their CLI ids is already
      # reachable under another name in this table. `antigravity-gemini-pro`
      # at the default effort resolves to gemini-3.1-pro-high (efforts
      # [low, high], and the medium tie breaks upward), `antigravity-gemini-flash` at
      # high to gemini-3.8-flash-high, and `antigravity-image` already carries
      # gemini-3.8-flash-low. That costs nothing: a model pause is keyed by
      # the id the CLI was actually given, so a refusal on any one of these
      # names darkens every other name that resolves to the same model.
      antigravity-gemini-pro-high:   { cli_model: gemini-3.1-pro-high,   effort_suffix: false }
      antigravity-gemini-flash-high: { cli_model: gemini-3.8-flash-high, effort_suffix: false }
      antigravity-gemini-flash-low:  { cli_model: gemini-3.8-flash-low,  effort_suffix: false }
      # The council's open-weights seat. `agy models` lists this family at one
      # effort only (gpt-oss-120b-medium), so `efforts` pins it: with the
      # provider's whole table open, a request asking for `high` would build
      # the model id `gpt-oss-120b-high`, which the CLI does not know.
      antigravity-gpt-oss:          { cli_model: gpt-oss-120b,     effort_suffix: true, efforts: [medium] }
      antigravity-claude-sonnet:    { cli_model: claude-sonnet-4-6 }
      antigravity-claude-opus:      { cli_model: claude-opus-4-6-thinking }
      # kind: image → served by /v1/images/generations and the generate_image MCP tool
      antigravity-image:            { cli_model: gemini-3.8-flash-low, kind: image, timeout_s: 240 }
      # The remaining fixed ids of `agy models`, each under a name of its own.
      # Every one is an alias: the effort-driven entries above already reach
      # them, at whatever level a request asks for. Naming them outright is
      # what lets a caller pin a rung instead of trusting the resolution — and
      # it costs nothing now that a model pause is keyed by the id the CLI was
      # given rather than by the gateway name (docs/backlog.md, Shipped).
      antigravity-gemini-flash-medium:  { cli_model: gemini-3.8-flash-medium, effort_suffix: false }
      antigravity-gemini-3.7-flash-high:   { cli_model: gemini-3.7-flash-high,   effort_suffix: false }
      antigravity-gemini-3.7-flash-medium: { cli_model: gemini-3.7-flash-medium, effort_suffix: false }
      antigravity-gemini-3.7-flash-low:    { cli_model: gemini-3.7-flash-low,    effort_suffix: false }
      antigravity-gemini-3.6-flash-high:   { cli_model: gemini-3.6-flash-high,   effort_suffix: false }
      antigravity-gemini-3.6-flash-medium: { cli_model: gemini-3.6-flash-medium, effort_suffix: false }
      antigravity-gemini-3.6-flash-low:    { cli_model: gemini-3.6-flash-low,    effort_suffix: false }
      antigravity-gemini-pro-low:          { cli_model: gemini-3.1-pro-low,      effort_suffix: false }
      # gpt-oss-120b-medium is not repeated here: `antigravity-gpt-oss` above is pinned
      # to the one level the family serves, so it is already the fixed rung.
    effort: { low: low, medium: medium, high: high }
    model_flag: --model
    effort_flag: null           # none: the effort is part of the model id (effort_suffix)
    effort_key: null
    args:
      - --output-format
      - stream-json
      - --input-format
      - stream-json
      - --disable-slash-commands
      - --sandbox
      - -p=
    args_extra: []            # what this host adds; only an overlay ever sets it
    # Put in front of every text run. Antigravity's tools cannot be switched
    # off by flag; the runner's strict permission denies them, and since 1.2.8
    # a denied tool ends the run with no answer. The high-reasoning models
    # reached for run_command to check what they were asked (measured
    # 2026-09-23). This tells them before they plan, and gives them the
    # behaviour to use instead of checking: say what they are unsure of.
    system_preamble: >-
      You are answering one question in a non-interactive session. You have no
      tools: you cannot run commands, read or write files, search the web or
      call any function, and any attempt will fail and leave the question
      unanswered. Answer directly and completely from what you already know.
      Where you are unsure of a fact, say so plainly instead of trying to
      check it.
    system_prompt_flag: null                         # none: prepended to the prompt with a role marker
    system_prompt_flag_prefix: null
    prompt_via: stdin                                # {"event":"user","message":{"role":"user","content":...}}
    # agy keeps every conversation in the runner's home (the full conversation,
    # its transcripts, a summary with a preview of the prompt) and has no option
    # not to, as Claude Code (--no-session-persistence) and Codex (--ephemeral)
    # do. The same helper as the images removes them after each run
    # (docs/deploy.md §7.1); the sudoers rule already allows it.
    forget: [/usr/local/bin/capitoline-collect-image, forget]
    image:
      # Image models: the CLI writes the file into its own home, never into the
      # sandbox. `collect` receives the conversation id as its last argument and
      # prints the image to stdout. On the host it is run through sudo as `runner`
      # (see docs/deploy.md §7.1); a developer machine sets runner.user: null and
      # points this at scripts/capitoline-collect-image, which then runs directly
      # as the developer, against that machine's own $HOME.
      collect: [/usr/local/bin/capitoline-collect-image]
      min_bytes: 200000       # anything smaller is a placeholder, not a picture
      quota_per_window: 12    # images per 5-hour window, reported in /health and /v1/models

# The council. A virtual model, asked for in `model` like any other, which
# answers by seating one member per family, having them rank each other's
# answers blind and letting a judge synthesize (design §12).
#
# A seat is a family and an ordered chain, never a single model: quotas run out
# one model at a time (on 2026-09-21 Fable was refused while the same
# subscription answered on Opus), and one seat per family is what buys
# independent judgment, because models of one lineage share their blind spots
# and rank each other's failures highly. `antigravity-claude-*` is deliberately not
# seated: it is the same opinion as the Anthropic seat, through another channel.
#
# The three prompts are not here. They are the strategy itself, not a CLI
# detail, so they live in src/council/prompts.ts and changing them changes the
# council's name (design §12.8).
council:
  capitoline:
    seats:
      - { family: anthropic,    models: [claude-fable, claude-opus, claude-sonnet] }
      - { family: openai,       models: [codex-gpt-6-astra, codex-gpt-5.6-sol, codex-gpt-6-luna] }
      - { family: google,       models: [antigravity-gemini-pro, antigravity-gemini-flash] }
      - { family: open-weights, models: [antigravity-gpt-oss] }
    # Every model here but the first sits in no seat of this council, and that
    # is the whole design of the chain. Measured 2026-09-23: the previous one
    # named the top model of each family, and *every* one of its five entries
    # was reachable by a seat. With judge_allow_member: false a seated model is
    # struck out of the chain, so the judge was never the best available — it
    # was whatever the panel had left over. On a day when claude-fable was
    # exhausted the anthropic seat took claude-opus, the first four entries
    # were all gone, and the panel was judged by codex-gpt-5.6-sol, the
    # cheapest thing in the list. That is the failure the chain was reordered
    # to prevent this morning, arriving by a different road.
    #
    # claude-opus stays at the head and stays seat-reachable on purpose: when
    # the anthropic seat takes claude-fable, as it does whenever Fable has
    # quota, this is free and it is the strongest model on the table. When
    # Fable is out the seat takes it instead, and the chain falls to
    # antigravity-claude-opus — Claude Opus 4.6 through the Google subscription, in no
    # seat of any council, spending neither the Anthropic weekly window nor the
    # Codex allowance that becomes a Plus allowance in October. So the good day
    # is judged by the best model and the bad day by a strong one, which is the
    # opposite of what the old chain did.
    #
    # Not used, although they sit in no seat: claude-opus-1m and its siblings
    # are the same model as a seated one with a wider context, so a judge
    # seated there would be weighing its own answer, which is exactly what
    # judge_allow_member: false exists to prevent.
    judge: { family: best-available, models: [claude-opus, antigravity-claude-opus, codex-gpt-6.1-sol, codex-gpt-5.6-terra] }
    judge_allow_member: false   # the judge is seated apart, so no synthesizer weighs its own answer
    judge_blind: true           # it sees the labels, never the real model names; the client gets the detail
    min_members: 2              # below two answers there is nothing to rank
    stage_timeout_s: 300        # per member, per stage — not for the whole deliberation

  # The same four families and the same judge, deliberating without the
  # ranking stage: five calls instead of nine. `ranking: false` is an engine
  # flag (src/council/council.ts skips stage 2, and the judge is given the
  # answers with no aggregate) and not a fourth prompt — the prompts are the
  # strategy and stay in the code (design §12.8).
  #
  # It is the everyday shape, and it is `capitoline` at reasoning_effort
  # low: a council with its ranking stage takes the request's effort as its
  # shape (low skips stage 2, high runs it), and this block is the same thing
  # pinned under a name of its own for clients that cannot send the field —
  # as antigravity-gemini-flash-low stands next to antigravity-gemini-flash.
  # With `ranking: false` the effort is declared ignored. The reference panel
  # above is the one to ask when the panel's own verdict on its answers is
  # worth its price; this one buys four independent perspectives and a
  # synthesis for half of it.
  #
  # Deliberately not a two-seat council that keeps the ranking, which costs
  # the same five calls: two members cast one vote each and cannot break a
  # tie, so four seats without a ranking buy four perspectives instead of two
  # and give up only a mechanism that barely works at that size.
  capitoline-fast:
    seats:
      - { family: anthropic,    models: [claude-fable, claude-opus, claude-sonnet] }
      - { family: openai,       models: [codex-gpt-6-astra, codex-gpt-5.6-sol, codex-gpt-6-luna] }
      - { family: google,       models: [antigravity-gemini-pro, antigravity-gemini-flash] }
      - { family: open-weights, models: [antigravity-gpt-oss] }
    judge: { family: best-available, models: [claude-opus, antigravity-claude-opus, codex-gpt-6.1-sol, codex-gpt-5.6-terra] }
    judge_allow_member: false   # the judge is seated apart, so no synthesizer weighs its own answer
    judge_blind: true           # it sees the labels, never the real model names; the client gets the detail
    min_members: 2              # below two answers there is nothing to synthesize
    ranking: false              # no stage 2: four answers and a synthesis, five calls
    stage_timeout_s: 300        # per member, per stage — not for the whole deliberation
