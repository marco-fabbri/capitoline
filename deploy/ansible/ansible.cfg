[defaults]
inventory = inventory.yml
# The runbook's steps take minutes on a slow disk; the default output is enough.
stdout_callback = default
retry_files_enabled = false

[ssh_connection]
# Tasks run as `runner` and `capitoline`, which are not the SSH user. Pipelining
# sends each module over the connection instead of through a temporary file
# those users could not read, so no ACL package is needed on the host.
pipelining = true
