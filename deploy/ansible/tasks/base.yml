# §1 and §2: the packages, and Node from NodeSource at the major of .nvmrc.
- name: Packages (§1)
  ansible.builtin.apt:
    name: [curl, ca-certificates, sudo, git, jq, sqlite3, python3, gnome-keyring, dbus-user-session]
    update_cache: true
    cache_valid_time: 3600

- name: NodeSource repository for Node {{ node_major }} (§2)
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  vars:
    node_major: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../.nvmrc') | trim }}"

- name: Node (§2)
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
